{% extends 'base.html' %}
{% block title %}Request Leave — Nexora OS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm p-4">
            <h4 class="fw-bold mb-3">Submit Time Off / Leave Request</h4>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Leave Category</label>
                    {{ form.leave_type }}
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Start Date</label>
                        {{ form.start_date }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">End Date</label>
                        {{ form.end_date }}
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Total Days</label>
                    {{ form.total_days }}
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold">Reason for Leave</label>
                    {{ form.reason }}
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'hr:leave_list' %}" class="btn btn-light border">Cancel</a>
                    <button type="submit" class="btn btn-primary">Submit for Approval</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
