{% extends 'base.html' %}
{% block title %}{{ title }} — Nexora OS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm p-4">
            <h4 class="fw-bold mb-3">{{ title }}</h4>
            <form method="post">
                {% csrf_token %}
                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">Ticket ID</label>
                        {{ form.ticket_id }}
                    </div>
                    <div class="col-md-8">
                        <label class="form-label small fw-semibold">Customer Account</label>
                        {{ form.customer }}
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Ticket Subject / Summary</label>
                    {{ form.subject }}
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">Ticket Category</label>
                        {{ form.category }}
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">Priority Level</label>
                        {{ form.priority }}
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">Assign Support Agent</label>
                        {{ form.assigned_to }}
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold">Detailed Description of Issue</label>
                    {{ form.description }}
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'support:ticket_list' %}" class="btn btn-light border">Cancel</a>
                    <button type="submit" class="btn btn-primary">Open Ticket</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
