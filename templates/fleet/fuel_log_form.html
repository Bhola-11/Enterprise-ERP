{% extends 'base.html' %}
{% block title %}{{ title }} — Nexora OS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm p-4">
            <h4 class="fw-bold mb-3">{{ title }}</h4>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Vehicle</label>
                    {{ form.vehicle }}
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Date</label>
                        {{ form.date }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Current Odometer (km)</label>
                        {{ form.odometer_km }}
                    </div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Volume Filled (Liters)</label>
                        {{ form.liters }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Cost per Liter ($)</label>
                        {{ form.cost_per_liter }}
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold">Fuel Station Location</label>
                    {{ form.station }}
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'fleet:list' %}" class="btn btn-light border">Cancel</a>
                    <button type="submit" class="btn btn-primary">Log Fuel Purchase</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
