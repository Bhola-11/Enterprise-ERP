{% extends 'base.html' %}
{% block title %}{{ title }} — Nexora OS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="card shadow-sm p-4">
            <h4 class="fw-bold mb-3">{{ title }}</h4>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Folder Name</label>
                    {{ form.name }}
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold">Parent Folder (Optional)</label>
                    {{ form.parent }}
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'documents:vault' %}" class="btn btn-light border">Cancel</a>
                    <button type="submit" class="btn btn-primary">Create Folder</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
