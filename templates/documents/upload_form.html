{% extends 'base.html' %}
{% block title %}{{ title }} — Nexora OS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm p-4">
            <h4 class="fw-bold mb-3">{{ title }}</h4>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Document Title</label>
                    {{ form.title }}
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Destination Folder</label>
                    {{ form.folder }}
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Select File</label>
                    {{ form.file }}
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold">Description / Change Log</label>
                    {{ form.description }}
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'documents:vault' %}" class="btn btn-light border">Cancel</a>
                    <button type="submit" class="btn btn-primary">Upload Document</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
