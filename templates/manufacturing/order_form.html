{% extends 'base.html' %}
{% block title %}{{ title }} — Nexora OS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm p-4">
            <h4 class="fw-bold mb-3">{{ title }}</h4>
            <form method="post">
                {% csrf_token %}
                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">Order #</label>
                        {{ form.order_number }}
                    </div>
                    <div class="col-md-8">
                        <label class="form-label small fw-semibold">Bill of Materials (Assembly Recipe)</label>
                        {{ form.bom }}
                    </div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Target Production Quantity</label>
                        {{ form.quantity_to_produce }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Assigned Work Center / Line</label>
                        {{ form.work_center }}
                    </div>
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Start Date</label>
                        {{ form.start_date }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Target Due Date</label>
                        {{ form.due_date }}
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'manufacturing:order_list' %}" class="btn btn-light border">Cancel</a>
                    <button type="submit" class="btn btn-primary">Schedule Production</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
