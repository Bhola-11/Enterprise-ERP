{% extends 'base.html' %}
{% block title %}{{ title }} — Nexora OS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm p-4">
            <h4 class="fw-bold mb-3">{{ title }}</h4>
            <form method="post">
                {% csrf_token %}
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">GL Account Code</label>
                        {{ form.code }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Account Classification</label>
                        {{ form.account_type }}
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Account Title / Name</label>
                    {{ form.name }}
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Parent Account (Optional)</label>
                    {{ form.parent_account }}
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Description / Purpose</label>
                    {{ form.description }}
                </div>
                <div class="mb-4">
                    <div class="form-check">
                        {{ form.is_active }}
                        <label class="form-check-label small fw-semibold" for="{{ form.is_active.id_for_label }}">Active Ledger Account</label>
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'accounting:chart_of_accounts' %}" class="btn btn-light border">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save GL Account</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
